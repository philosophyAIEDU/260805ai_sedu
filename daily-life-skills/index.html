<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#EEF4F8" />
<title>일상생활기술 연습</title>
<meta name="description" content="지하철·버스·길찾기·무인매장·카페·영화관·병원·마트 — 지역사회 일상생활기술을 게임으로 연습해요" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF4F8;
    --surface: #FFFFFF;
    --panel: #F7FBFD;
    --ink: #1F3340;
    --ink-soft: #5A7183;
    --accent: #2E86AB;
    --accent-ink: #FFFFFF;
    --good: #2F9E68;
    --good-soft: #E4F5EC;
    --warn: #E07B39;
    --warn-soft: #FDF0E6;
    --gold: #F2B341;
    --line: #D6E3EC;
    --shadow: 0 14px 30px -16px rgba(31,51,64,0.30);
    --r-lg: 26px;
    --r-md: 18px;
    --r-sm: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131E26;
      --surface: #1C2A34;
      --panel: #223240;
      --ink: #E9F2F7;
      --ink-soft: #9FB8C7;
      --accent: #4FA8CC;
      --accent-ink: #10202A;
      --good: #5BC48B;
      --good-soft: #1E3A2C;
      --warn: #F0975C;
      --warn-soft: #3A2A1C;
      --gold: #F7C566;
      --line: #33485A;
      --shadow: 0 14px 30px -16px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #131E26; --surface: #1C2A34; --panel: #223240;
    --ink: #E9F2F7; --ink-soft: #9FB8C7;
    --accent: #4FA8CC; --accent-ink: #10202A;
    --good: #5BC48B; --good-soft: #1E3A2C;
    --warn: #F0975C; --warn-soft: #3A2A1C; --gold: #F7C566;
    --line: #33485A; --shadow: 0 14px 30px -16px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif;
    -webkit-font-smoothing: antialiased; touch-action: manipulation;
  }
  h1, h2, h3, .display { font-family: 'Do Hyeon', 'Trebuchet MS', sans-serif; font-weight: 400; text-wrap: balance; }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  .app { max-width: 940px; margin: 0 auto; padding: clamp(12px, 2.5vw, 24px);
         display: flex; flex-direction: column; gap: clamp(14px, 2vw, 20px); }

  /* ---------- Top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 10px;
            background: var(--surface); border-radius: var(--r-lg);
            padding: 10px 14px; box-shadow: var(--shadow); }
  .brand { display: flex; align-items: center; gap: 9px; margin-right: auto; min-width: 0; }
  .brand-ic { font-size: 1.7rem; line-height: 1; }
  .brand h1 { margin: 0; font-size: clamp(1.1rem, 3vw, 1.5rem);
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { border: 2px solid var(--line); background: var(--bg); color: var(--ink);
              border-radius: 999px; width: 46px; height: 46px; min-width: 46px; font-size: 1.25rem;
              cursor: pointer; display: grid; place-items: center; text-decoration: none; }
  .icon-btn[aria-pressed="false"] { opacity: .45; }
  .icon-btn[hidden] { display: none; }

  /* ---------- Buttons ---------- */
  .btn { border: none; border-radius: 999px; padding: 14px 22px; font-size: 1.05rem;
         cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
         font-family: 'Do Hyeon', sans-serif; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
  .btn:active { transform: translateY(1px); }

  /* ---------- Home ---------- */
  .home-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; }
  .home-sub { margin: 0; color: var(--ink-soft); font-size: 1.05rem; margin-right: auto; }
  .star-bar { background: var(--surface); border: 2px solid var(--line); border-radius: 999px;
              padding: 8px 18px; font-family: 'Do Hyeon', sans-serif; font-size: 1.05rem; }
  .star-bar b { color: var(--accent); font-size: 1.2rem; }

  .mission-grid { display: grid; gap: 12px;
                  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .mcard { position: relative; text-align: left; cursor: pointer;
           background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-md);
           padding: 16px 14px; display: flex; flex-direction: column; gap: 4px;
           color: var(--ink); box-shadow: var(--shadow);
           transition: transform .14s ease, border-color .14s ease; }
  .mcard:hover { transform: translateY(-2px); border-color: var(--accent); }
  .mcard-ic { font-size: 2.2rem; line-height: 1.1; }
  .mcard-title { font-family: 'Do Hyeon', sans-serif; font-size: 1.2rem; }
  .mcard-desc { color: var(--ink-soft); font-size: .92rem; }
  .mcard-ch { color: var(--ink-soft); font-size: .78rem; opacity: .8; }
  .mcard.done { border-color: var(--gold); background: linear-gradient(180deg, rgba(242,179,65,.10), transparent 60%), var(--surface); }
  .mcard-star { position: absolute; top: 10px; right: 12px; font-size: 1.5rem; }
  .home-foot { display: flex; justify-content: center; padding-top: 4px; }

  /* ---------- Play ---------- */
  .dots { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .dot.cur { background: var(--accent); transform: scale(1.25); }
  .dot.ok { background: var(--good); }

  .stage { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow);
           padding: clamp(16px, 3vw, 26px); display: flex; flex-direction: column;
           align-items: center; gap: 16px; }
  .scene { font-size: clamp(3rem, 12vw, 4.6rem); line-height: 1.15; text-align: center; }
  .question { margin: 0; font-size: clamp(1.15rem, 3.4vw, 1.5rem); text-align: center;
              font-family: 'Do Hyeon', sans-serif; line-height: 1.5; }
  .qsub { margin: -8px 0 0; color: var(--ink-soft); font-size: .98rem; text-align: center; }

  .answers { display: grid; gap: 12px; width: 100%; max-width: 560px; }
  .ans-btn { display: flex; align-items: center; gap: 14px; text-align: left;
             background: var(--panel); border: 3px solid var(--line); border-radius: var(--r-md);
             padding: 16px 18px; font-size: 1.1rem; color: var(--ink); cursor: pointer;
             min-height: 68px; transition: border-color .12s ease, background .12s ease; }
  .ans-btn:hover { border-color: var(--accent); }
  .ans-btn .ic { font-size: 1.8rem; line-height: 1; }
  .ans-btn.right { border-color: var(--good); background: var(--good-soft); }
  .ans-btn.wrong { border-color: var(--warn); background: var(--warn-soft); }
  .ans-btn[disabled] { cursor: default; }

  .ox-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 460px; }
  .ox-btn { border: 4px solid var(--line); background: var(--panel); border-radius: var(--r-md);
            padding: 20px 10px; cursor: pointer; color: var(--ink);
            display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .ox-btn .mark { font-size: 3rem; line-height: 1; font-family: 'Do Hyeon', sans-serif; }
  .ox-btn .lab { font-size: 1.05rem; }
  .ox-btn.o .mark { color: var(--good); }
  .ox-btn.x .mark { color: var(--warn); }
  .ox-btn.right { border-color: var(--good); background: var(--good-soft); }
  .ox-btn.wrong { border-color: var(--warn); background: var(--warn-soft); }

  /* ---------- Feedback ---------- */
  .feedback { border-radius: var(--r-md); padding: 16px 20px; display: flex; gap: 12px;
              align-items: flex-start; font-size: 1.05rem; line-height: 1.55; }
  .feedback[hidden] { display: none; }
  .feedback .fic { font-size: 1.7rem; line-height: 1; }
  .feedback.ok { background: var(--good-soft); border: 2px solid var(--good); }
  .feedback.no { background: var(--warn-soft); border: 2px solid var(--warn); }
  .feedback b { font-family: 'Do Hyeon', sans-serif; }
  .play-foot { display: flex; justify-content: center; }
  .play-foot[hidden] { display: none; }

  /* ---------- Visuals ---------- */
  .visual { width: 100%; max-width: 620px; background: var(--panel);
            border: 2px solid var(--line); border-radius: var(--r-md); padding: 14px; }
  .visual svg { width: 100%; height: auto; display: block; }
  .vis-cap { text-align: center; color: var(--ink-soft); font-size: .9rem; margin: 8px 0 0; }

  .floors { width: 100%; max-width: 420px; border: 3px solid var(--ink);
            border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
  .floors .fh { background: var(--ink); color: var(--surface); text-align: center;
                padding: 8px; font-family: 'Do Hyeon', sans-serif; letter-spacing: .1em; }
  .floors .fr { display: flex; border-top: 2px solid var(--line); }
  .floors .fr:first-of-type { border-top: none; }
  .floors .fn { width: 76px; min-width: 76px; background: var(--panel); text-align: center;
                padding: 12px 0; font-family: 'Do Hyeon', sans-serif; font-size: 1.15rem;
                border-right: 2px solid var(--line); }
  .floors .fd { padding: 12px 14px; font-size: 1.02rem; }

  /* ---------- Seat game ---------- */
  .ticket { width: 100%; max-width: 340px; background: var(--surface);
            border: 3px dashed var(--accent); border-radius: var(--r-md); padding: 14px 18px; }
  .ticket .tt { font-family: 'Do Hyeon', sans-serif; color: var(--accent);
                text-align: center; font-size: 1.1rem; margin-bottom: 8px; }
  .ticket .tseat { display: flex; justify-content: center; align-items: baseline; gap: 6px;
                   font-family: 'Do Hyeon', sans-serif; font-size: 2.1rem; }
  .ticket .tseat small { font-size: 1rem; color: var(--ink-soft); }
  .screen-bar { width: 100%; max-width: 560px; background: var(--ink); color: var(--surface);
                text-align: center; padding: 10px; border-radius: 8px 8px 26px 26px;
                font-family: 'Do Hyeon', sans-serif; letter-spacing: .3em; }
  .seat-board { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 560px; }
  .seat-row { display: flex; align-items: center; gap: 8px; }
  .seat-row .rlab { width: 30px; min-width: 30px; text-align: center;
                    font-family: 'Do Hyeon', sans-serif; color: var(--ink-soft); }
  .seat-row .seats { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; flex: 1; }
  .seat { aspect-ratio: 1/1; border: 2px solid var(--line); background: var(--panel);
          border-radius: 8px 8px 4px 4px; cursor: pointer; color: var(--ink-soft);
          font-size: .85rem; display: grid; place-items: center; padding: 0; }
  .seat:hover { border-color: var(--accent); }
  .seat.right { background: var(--good); border-color: var(--good); color: #fff; }
  .seat.wrong { background: var(--warn-soft); border-color: var(--warn); }

  /* ---------- Sequence game ---------- */
  .seq-list { display: grid; gap: 10px; width: 100%; max-width: 560px; }
  .seq-item { display: flex; align-items: center; gap: 12px; text-align: left;
              background: var(--panel); border: 3px solid var(--line); border-radius: var(--r-md);
              padding: 14px 16px; font-size: 1.05rem; color: var(--ink); cursor: pointer; min-height: 62px; }
  .seq-item:hover { border-color: var(--accent); }
  .seq-item .num { width: 34px; min-width: 34px; height: 34px; border-radius: 50%;
                   background: var(--line); color: var(--ink-soft); display: grid; place-items: center;
                   font-family: 'Do Hyeon', sans-serif; }
  .seq-item.picked { border-color: var(--good); background: var(--good-soft); }
  .seq-item.picked .num { background: var(--good); color: #fff; }
  .seq-item.shake { animation: shake .3s; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  /* ---------- Bus bell game ---------- */
  .bus-scene { width: 100%; max-width: 560px; background: var(--panel);
               border: 3px solid var(--line); border-radius: var(--r-md); padding: 18px; }
  .bus-target { text-align: center; font-family: 'Do Hyeon', sans-serif; font-size: 1.15rem;
                color: var(--accent); margin-bottom: 12px; }
  .bus-sign { background: var(--ink); color: #FFD86B; border-radius: 10px; padding: 18px 12px;
              text-align: center; font-family: 'Do Hyeon', sans-serif;
              font-size: clamp(1.05rem, 3.6vw, 1.4rem); min-height: 76px;
              display: grid; place-items: center; }
  .bell-btn { margin: 16px auto 0; display: block; width: 128px; height: 128px; border-radius: 50%;
              border: 6px solid #B23B3B; background: #E85555; color: #fff; cursor: pointer;
              font-family: 'Do Hyeon', sans-serif; font-size: 1.1rem; line-height: 1.3; }
  .bell-btn:active { transform: scale(.95); }
  .bell-btn[disabled] { opacity: .5; cursor: default; }

  /* ---------- Done screen ---------- */
  .done-card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow);
               padding: 32px 24px; text-align: center; display: flex; flex-direction: column;
               align-items: center; gap: 14px; }
  .done-card .big { font-size: 4.4rem; line-height: 1; }
  .done-card h2 { margin: 0; font-size: 1.7rem; }
  .done-card p { margin: 0; color: var(--ink-soft); font-size: 1.05rem; }
  .done-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }

  #confetti-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
  .confetto { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px;
              animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px);
           background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 999px;
           font-size: .98rem; opacity: 0; pointer-events: none; z-index: 50; max-width: 90vw;
           text-align: center; transition: opacity .25s ease, transform .25s ease; box-shadow: var(--shadow); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .confetto { display: none; }
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }

  footer.credit { text-align: center; color: var(--ink-soft); font-size: .85rem; padding: 4px 0 10px; }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <a class="icon-btn" id="btnHome" href="../index.html" aria-label="처음 화면으로 가기" title="처음 화면으로">🏠</a>
    <button class="icon-btn" id="btnBack" hidden aria-label="미션 고르기로 돌아가기" title="돌아가기">←</button>
    <div class="brand">
      <span class="brand-ic" aria-hidden="true">🏙️</span>
      <h1 id="topTitle">일상생활기술 연습</h1>
    </div>
    <button class="icon-btn" id="btnRead" aria-pressed="true" aria-label="읽어주기 켜기/끄기" title="읽어주기">🗣️</button>
    <button class="icon-btn" id="btnSound" aria-pressed="true" aria-label="소리 켜기/끄기" title="소리">🔊</button>
  </header>

  <main>
    <!-- ===== 미션 고르기 ===== -->
    <section id="screen-home">
      <div class="home-head">
        <p class="home-sub">해 보고 싶은 미션을 골라 보세요!</p>
        <div class="star-bar">완료한 미션 <b id="starCount">0</b> / <span id="starTotal">11</span> ⭐</div>
      </div>
      <div class="mission-grid" id="missionGrid"></div>
      <div class="home-foot">
        <button class="btn btn-ghost" id="btnReset">🔄 처음부터 다시 하기</button>
      </div>
    </section>

    <!-- ===== 문제 풀기 ===== -->
    <section id="screen-play" hidden>
      <div class="dots" id="stepDots"></div>
      <div class="stage" id="stage"></div>
      <div class="feedback" id="feedback" hidden></div>
      <div class="play-foot" id="playFoot" hidden>
        <button class="btn btn-primary" id="btnNext">다음으로 →</button>
      </div>
    </section>

    <!-- ===== 미션 완료 ===== -->
    <section id="screen-done" hidden>
      <div class="done-card">
        <div class="big" id="doneEmoji" aria-hidden="true">🎉</div>
        <h2 id="doneTitle">미션 성공!</h2>
        <p id="doneText">잘 했어요!</p>
        <div class="done-actions">
          <button class="btn btn-ghost" id="btnAgain">🔁 한 번 더 하기</button>
          <button class="btn btn-primary" id="btnToHome">🏠 다른 미션 하기</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="credit">『이젠 나를 응원해!』 2권 지역사회 — 배운 내용을 게임으로 연습해요</footer>
</div>

<div class="toast" id="toast" aria-live="polite"></div>
<div id="confetti-layer" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  /* ==================== 소리 ==================== */
  var audioCtx = null;
  var muted = localStorage.getItem('dls-muted') === '1';
  var readAloud = localStorage.getItem('dls-read') !== '0';

  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(o) {
    if (muted) return;
    var ctx = ensureAudio();
    var t0 = ctx.currentTime + (o.delay || 0);
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.freq, t0);
    if (o.sweepTo) osc.frequency.exponentialRampToValueAtTime(o.sweepTo, t0 + o.duration);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(o.gain || 0.15, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.duration);
    osc.connect(g).connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + o.duration + 0.03);
  }
  function sTap()     { tone({ freq: 900, duration: .06, type: 'square', gain: .07 }); }
  function sRight()   { [659.25, 880, 1174.66].forEach(function (f, i) { tone({ freq: f, duration: .22, type: 'triangle', gain: .2, delay: i * .09 }); }); }
  function sTryAgain(){ tone({ freq: 340, duration: .22, type: 'sine', gain: .16, sweepTo: 260 }); }
  function sCheer()   { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone({ freq: f, duration: .28, type: 'triangle', gain: .2, delay: i * .12 }); }); }
  function sBell()    { tone({ freq: 1200, duration: .5, type: 'sine', gain: .2 }); tone({ freq: 1600, duration: .45, type: 'sine', gain: .12, delay: .04 }); }
  function sAnnounce(){ tone({ freq: 880, duration: .14, type: 'sine', gain: .13 }); tone({ freq: 1174, duration: .18, type: 'sine', gain: .13, delay: .12 }); }

  /* 읽어주기 (브라우저 음성, 인터넷/API 필요 없음) */
  var canSpeak = 'speechSynthesis' in window;
  function speak(text) {
    if (!canSpeak || !readAloud || !text) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text).replace(/\s+/g, ' ').trim());
      u.lang = 'ko-KR';
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  function stopSpeak() { if (canSpeak) { try { window.speechSynthesis.cancel(); } catch (e) {} } }

  var btnSound = document.getElementById('btnSound');
  var btnRead = document.getElementById('btnRead');
  function refreshToggles() {
    btnSound.textContent = muted ? '🔇' : '🔊';
    btnSound.setAttribute('aria-pressed', String(!muted));
    btnRead.setAttribute('aria-pressed', String(readAloud));
    btnRead.title = readAloud ? '읽어주기 켜짐' : '읽어주기 꺼짐';
  }
  btnSound.addEventListener('click', function () {
    muted = !muted;
    localStorage.setItem('dls-muted', muted ? '1' : '0');
    refreshToggles();
    if (!muted) sTap();
  });
  btnRead.addEventListener('click', function () {
    readAloud = !readAloud;
    localStorage.setItem('dls-read', readAloud ? '1' : '0');
    refreshToggles();
    if (readAloud) speak('읽어주기를 켰어요'); else stopSpeak();
  });
  if (!canSpeak) btnRead.hidden = true;
  refreshToggles();

  /* ==================== 안내 문구 · 축하 ==================== */
  var toastEl = document.getElementById('toast'), toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');

  /* ==================== 그림 자료 ==================== */

      svg.push('<text x="70" y="30" text-anchor="start" font-size="17" font-family="sans-serif" fill="#5A7183">◀ 신창 방면</text>');
      svg.push('<text x="550" y="30" text-anchor="end" font-size="17" font-family="sans-serif" fill="#5A7183">청량리 방면 ▶</text>');

      g.push('<text x="215" y="158" text-anchor="end" font-size="17" font-family="sans-serif" font-weight="bold" fill="#E07B39">3호선</text>');
      [['신사', 240], ['안국', 480]].forEach(function (o) {
        g.push('<circle cx="' + o[1] + '" cy="152" r="12" fill="#FFF" stroke="#E07B39" stroke-width="6"/>');
        g.push('<text x="' + o[1] + '" y="188" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#1F3340">' + o[0] + '</text>');

      g.push('<circle cx="480" cy="62" r="15" fill="#FFF" stroke="#8557A8" stroke-width="7"/>');

  /* ==================== 화면 전환 ==================== */
  var screens = {
    home: document.getElementById('screen-home'),
    play: document.getElementById('screen-play'),
    done: document.getElementById('screen-done')
  };
  var stageEl = document.getElementById('stage');
  var feedbackEl = document.getElementById('feedback');
  var playFoot = document.getElementById('playFoot');
  var btnNext = document.getElementById('btnNext');
  var btnBack = document.getElementById('btnBack');
  var btnHome = document.getElementById('btnHome');
  var topTitle = document.getElementById('topTitle');
  var dotsEl = document.getElementById('stepDots');

  function show(name) {
    Object.keys(screens).forEach(function (k) { screens[k].hidden = k !== name; });
    btnBack.hidden = (name === 'home');
    btnHome.hidden = (name !== 'home');
  }

  var state = { mission: null, idx: 0, missed: 0 };
  var bellTimers = [];
  function clearBell() { bellTimers.forEach(clearTimeout); bellTimers = []; }

  /* ==================== 미션 고르기 화면 ==================== */
  var grid = document.getElementById('missionGrid');
  document.getElementById('starTotal').textContent = MISSIONS.length;

  function renderHome() {
    clearBell(); stopSpeak();
    topTitle.textContent = '일상생활기술 연습';
    grid.innerHTML = '';
    var done = 0;
    MISSIONS.forEach(function (m) {
      var isDone = !!(progress[m.id] && progress[m.id].done);
      if (isDone) done++;
      var card = el('button', { class: 'mcard' + (isDone ? ' done' : ''), type: 'button',
                                'aria-label': m.title + '. ' + m.desc + (isDone ? '. 완료했어요' : '') }, [
        el('span', { class: 'mcard-ic', 'aria-hidden': 'true', text: m.emoji }),
        el('span', { class: 'mcard-title', text: m.title }),
        el('span', { class: 'mcard-desc', text: m.desc }),
        el('span', { class: 'mcard-ch', text: m.chapter })
      ]);
      if (isDone) card.appendChild(el('span', { class: 'mcard-star', 'aria-hidden': 'true', text: '⭐' }));
      card.addEventListener('click', function () { sTap(); openMission(m); });
      grid.appendChild(card);
    });
    document.getElementById('starCount').textContent = done;
    show('home');
  }

  /* ==================== 미션 진행 ==================== */
  function openMission(m) {
    state.mission = m; state.idx = 0; state.missed = 0;
    topTitle.textContent = m.emoji + ' ' + m.title;
    show('play');
    renderStep();
  }

  function renderDots() {
    dotsEl.innerHTML = '';
    state.mission.steps.forEach(function (_, i) {
      dotsEl.appendChild(el('span', {
        class: 'dot' + (i < state.idx ? ' ok' : (i === state.idx ? ' cur' : '')),
        'aria-hidden': 'true'
      }));
    });
  }

  function renderStep() {
    clearBell();
    var step = state.mission.steps[state.idx];
    feedbackEl.hidden = true;
    playFoot.hidden = true;
    stageEl.innerHTML = '';
    renderDots();

    if (step.visual) stageEl.appendChild(buildVisual(step.visual));
    if (step.scene) stageEl.appendChild(el('div', { class: 'scene', 'aria-hidden': 'true', text: step.scene }));
    stageEl.appendChild(el('h2', { class: 'question', text: step.text }));
    if (step.sub) stageEl.appendChild(el('p', { class: 'qsub', text: step.sub }));

    if (step.type === 'ox') renderOX(step);
    else if (step.type === 'choice') renderChoice(step);
    else if (step.type === 'seat') renderSeat(step);
    else if (step.type === 'sequence') renderSequence(step);
    else if (step.type === 'bell') renderBell(step);

    speak(step.text);
  }

  function lockAll(nodes) { nodes.forEach(function (n) { n.disabled = true; }); }

  function correct(step, extra) {
    sRight();
    feedbackEl.className = 'feedback ok';
    feedbackEl.innerHTML = '';
    feedbackEl.appendChild(el('span', { class: 'fic', 'aria-hidden': 'true', text: '🎉' }));
    feedbackEl.appendChild(el('div', {}, [
      el('div', {}, [el('b', { text: extra || '잘했어요!' })]),
      el('div', { text: step.why || '' })
    ]));
    feedbackEl.hidden = false;
    playFoot.hidden = false;
    btnNext.textContent = (state.idx >= state.mission.steps.length - 1) ? '미션 끝내기 ✓' : '다음으로 →';
    speak((extra || '잘했어요') + '. ' + (step.why || ''));
  }

  function tryAgain(msg) {
    state.missed++;
    sTryAgain();
    feedbackEl.className = 'feedback no';
    feedbackEl.innerHTML = '';
    feedbackEl.appendChild(el('span', { class: 'fic', 'aria-hidden': 'true', text: '🤔' }));
    feedbackEl.appendChild(el('div', {}, [
      el('div', {}, [el('b', { text: '다시 한 번 해 볼까요?' })]),
      el('div', { text: msg || '' })
    ]));
    feedbackEl.hidden = false;
    speak('다시 한 번 해 볼까요? ' + (msg || ''));
  }

  /* ---- O / X ---- */
  function renderOX(step) {
    var row = el('div', { class: 'ox-row' });
    var btns = [];
    [{ v: true, cls: 'o', mark: 'O', lab: '맞아요' }, { v: false, cls: 'x', mark: 'X', lab: '아니에요' }]
      .forEach(function (o) {
        var b = el('button', { class: 'ox-btn ' + o.cls, type: 'button', 'aria-label': o.lab }, [
          el('span', { class: 'mark', 'aria-hidden': 'true', text: o.mark }),
          el('span', { class: 'lab', text: o.lab })
        ]);
        b.addEventListener('click', function () {
          if (o.v === step.answer) { b.classList.add('right'); lockAll(btns); correct(step); }
          else { b.classList.add('wrong'); tryAgain('힌트를 잘 읽고 다른 쪽을 눌러 보세요.'); }
        });
        btns.push(b); row.appendChild(b);
      });
    stageEl.appendChild(row);
  }

  /* ---- 여러 개 중 고르기 ---- */
  function renderChoice(step) {
    var wrap = el('div', { class: 'answers' });
    var btns = [];
    step.options.forEach(function (opt, i) {
      var b = el('button', { class: 'ans-btn', type: 'button' }, [
        el('span', { class: 'ic', 'aria-hidden': 'true', text: opt.ic }),
        el('span', { text: opt.label })
      ]);
      b.addEventListener('click', function () {
        if (i === step.answer) { b.classList.add('right'); lockAll(btns); correct(step); }
        else { b.classList.add('wrong'); tryAgain('다른 것을 한번 눌러 보세요.'); }
      });
      btns.push(b); wrap.appendChild(b);
    });
    stageEl.appendChild(wrap);
  }

  /* ---- 영화관 좌석 찾기 ---- */
  function renderSeat(step) {
    var t = step.ticket;
    stageEl.appendChild(el('div', { class: 'ticket' }, [
      el('div', { class: 'tt', text: '🎟️ 영화 입장권' }),
      el('div', { class: 'tseat' }, [
        el('span', { text: t.row }), el('small', { text: '열' }),
        el('span', { text: String(t.num) }), el('small', { text: '번' })
      ])
    ]));
    stageEl.appendChild(el('div', { class: 'screen-bar', text: '스 크 린' }));
    var board = el('div', { class: 'seat-board' });
    var rows = ['A', 'B', 'C', 'D'];
    var seats = [];
    rows.forEach(function (r) {
      var seatsWrap = el('div', { class: 'seats' });
      for (var n = 1; n <= 8; n++) {
        (function (rr, nn) {
          var s = el('button', { class: 'seat', type: 'button', text: String(nn),
                                 'aria-label': rr + '열 ' + nn + '번 자리' });
          s.addEventListener('click', function () {
            if (rr === t.row && nn === t.num) {
              s.classList.add('right'); lockAll(seats); correct(step, '자리를 찾았어요!');
            } else {
              s.classList.add('wrong');
              setTimeout(function () { s.classList.remove('wrong'); }, 700);
              tryAgain('입장권의 ' + t.row + '열을 먼저 찾고, 그 줄에서 ' + t.num + '번을 찾아보세요.');
            }
          });
          seats.push(s); seatsWrap.appendChild(s);
        })(r, n);
      }
      board.appendChild(el('div', { class: 'seat-row' }, [
        el('span', { class: 'rlab', text: r }), seatsWrap
      ]));
    });
    stageEl.appendChild(board);
  }

  /* ---- 순서 맞추기 ---- */
  function renderSequence(step) {
    var order = step.items.map(function (_, i) { return i; });
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    var next = 0;
    var list = el('div', { class: 'seq-list' });
    var nodes = [];
    order.forEach(function (origIdx) {
      var b = el('button', { class: 'seq-item', type: 'button' }, [
        el('span', { class: 'num', 'aria-hidden': 'true', text: '?' }),
        el('span', { text: step.items[origIdx] })
      ]);
      b.addEventListener('click', function () {
        if (b.classList.contains('picked')) return;
        if (origIdx === next) {
          next++;
          b.classList.add('picked');
          b.querySelector('.num').textContent = String(next);
          sTap();
          if (next === step.items.length) { lockAll(nodes); correct(step, '순서를 다 맞췄어요!'); }
        } else {
          b.classList.add('shake');
          setTimeout(function () { b.classList.remove('shake'); }, 320);
          tryAgain('가장 먼저 해야 하는 것부터 눌러 보세요.');
        }
      });
      nodes.push(b); list.appendChild(b);
    });
    stageEl.appendChild(list);
  }

  /* ---- 버스 하차벨 ---- */
  function renderBell(step) {
    var scene = el('div', { class: 'bus-scene' });
    scene.appendChild(el('div', { class: 'bus-target', text: '🚌 ' + step.target + '에서 내려요' }));
    var sign = el('div', { class: 'bus-sign', text: '곧 출발합니다' });
    scene.appendChild(sign);
    var bell = el('button', { class: 'bell-btn', type: 'button', 'aria-label': '하차벨 누르기',
                              html: '🔔<br>내려요' });
    scene.appendChild(bell);
    stageEl.appendChild(scene);

    var targetIdx = step.stops.indexOf(step.target);
    var cur = -1, done = false;

    function endRound(ok, msg) {
      if (done) return;
      done = true; clearBell(); bell.disabled = true;
      if (ok) { sBell(); correct(step, '딩동! 잘 눌렀어요'); }
      else {
        tryAgain(msg);
        var retry = el('button', { class: 'btn btn-ghost', type: 'button', text: '🔁 다시 해 보기' });
        retry.addEventListener('click', function () { sTap(); renderStep(); });
        scene.appendChild(el('div', { style: 'display:flex;justify-content:center;margin-top:14px' }, [retry]));
      }
    }

    bell.addEventListener('click', function () {
      if (done) return;
      if (cur === targetIdx) endRound(true);
      else if (cur > targetIdx) endRound(false, step.target + '을(를) 지나쳤어요. "다음 정류장은 ' + step.target + '입니다" 방송에서 눌러요.');
      else endRound(false, '아직 ' + step.target + ' 방송이 나오지 않았어요. 방송을 듣고 눌러요.');
    });

    step.stops.forEach(function (s, i) {
      bellTimers.push(setTimeout(function () {
        if (done) return;
        cur = i;
        var line = '다음 정류장은 ' + s + '입니다';
        sign.textContent = line;
        sAnnounce();
        speak(line);
      }, 1200 + i * 3200));
    });
    bellTimers.push(setTimeout(function () {
      if (!done) endRound(false, step.target + '을(를) 지나쳤어요. "다음 정류장은 ' + step.target + '입니다" 방송에서 눌러요.');
    }, 1200 + step.stops.length * 3200));
  }

  /* ==================== 다음 / 완료 ==================== */
  btnNext.addEventListener('click', function () {
    sTap(); clearBell(); stopSpeak();
    if (state.idx >= state.mission.steps.length - 1) finishMission();
    else { state.idx++; renderStep(); }
  });

  function finishMission() {
    var m = state.mission;
    progress[m.id] = { done: true };
    saveProgress();
    var perfect = state.missed === 0;
    document.getElementById('doneEmoji').textContent = perfect ? '🏆' : '🎉';
    document.getElementById('doneTitle').textContent = m.title + ' 미션 성공!';
    document.getElementById('doneText').textContent = perfect
      ? '한 번도 틀리지 않았어요. 정말 잘했어요!'
      : '끝까지 해냈어요. 참 잘했어요!';
    show('done');
    burstConfetti(); sCheer();
    speak(m.title + ' 미션 성공! 참 잘했어요.');
  }

  document.getElementById('btnAgain').addEventListener('click', function () {
    sTap(); openMission(state.mission);
  });
  document.getElementById('btnToHome').addEventListener('click', function () { sTap(); renderHome(); });
  btnBack.addEventListener('click', function () { sTap(); renderHome(); });

  document.getElementById('btnReset').addEventListener('click', function () {
    if (!window.confirm('완료한 미션 기록을 모두 지울까요?')) return;
    progress = {}; saveProgress(); renderHome();
    showToast('기록을 지웠어요. 처음부터 다시 해요!');
  });

  renderHome();
})();
</script>
</body>
</html>
